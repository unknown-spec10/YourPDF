name: Deploy Web

# Builds the container, proves it works *inside* the image, then deploys to Cloud Run.
#
# Registry is Docker Hub (deepdocker2023/yourpdf-web), NOT Artifact Registry: that is what
# the live service was deployed from, and Cloud Run pulls it via its mirror.gcr.io mirror.
# Auth uses the repo secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN.
#
# One mutable tag only: every build overwrites `:latest`; no per-commit, dated or version
# tags are ever pushed, so the registry holds exactly one tag. Rollback is done by shifting
# Cloud Run traffic to a previous revision — each revision pins the digest it was deployed
# with, so the digest lives in the revisions rather than in a pile of registry tags.
#
# The deploy job is SKIPPED when GCP credentials are not configured (`vars.GCP_PROJECT_ID`
# empty). The repo currently has NO GCP variables set, so a push to main builds and smokes
# the image but does not produce a red build. Set the variables below to enable deploys.
#
# Required repository *variables* (Settings → Secrets and variables → Actions → Variables):
#   GCP_PROJECT_ID                 project that hosts the service (gen-lang-client-0977081292)
#   GCP_REGION                     asia-south1
#   GCP_SERVICE_NAME               yourpdf-web
#   GCP_WORKLOAD_IDENTITY_PROVIDER full resource name of the WIF provider
#   GCP_DEPLOY_SERVICE_ACCOUNT     service account used to deploy (roles/run.developer)
#   PUBLIC_SITE_URL                absolute origin baked into the Next export as the
#                                  NEXT_PUBLIC_SITE_URL build arg (og:image/twitter metadata)
# Nothing is stored as a long-lived key: the deploy job federates via OIDC.
#
# The service is IAP-protected (direct Cloud Run IAP, no load balancer, no IAP charge): every
# request must pass a Google sign-in, and only identities holding roles/iap.httpsResourceAccessor
# get through. The IAP OAuth client is wired at the project level
# (gcloud alpha iap settings set --resource-type=cloud-run), NOT by this workflow — the deploy
# command deliberately passes no --iap flag, so the service-level setting persists across
# revisions. This workflow must NEVER grant allUsers roles/run.invoker: that makes the gate
# cosmetic. The verify step therefore asserts the 302 to accounts.google.com, not a 200.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build, push, smoke
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/yourpdf-web
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        # --provenance=false --sbom=false are load-bearing: a default buildx push produces
        # an OCI index with an attestation entry, and Cloud Run's mirror.gcr.io rejects that
        # layout with a misleading "Image '...' not found". These flags force a plain Docker
        # v2 manifest. --platform linux/amd64 because Cloud Run does not run arm64.
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ vars.PUBLIC_SITE_URL }}" \
            -f web/Dockerfile \
            -t "$IMAGE_REPO:latest" \
            --push .

      - name: Smoke the image before it can reach users
        # This is the real deploy gate: run the suite against the pushed image itself and
        # fail on a SKIP — a missing native tool (LibreOffice, tessdata, ocrmypdf) must fail
        # here, not on the first user's pptx. Pulling the tag also proves the push landed.
        run: |
          docker pull "$IMAGE_REPO:latest"
          docker run -d --name smoke -p 8080:8080 "$IMAGE_REPO:latest"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
          docker exec smoke python -m web.tests.smoke_endpoints --base http://127.0.0.1:8080 --fail-on-skip
          # The export is git-ignored; assert the image actually serves it.
          curl -fsS http://127.0.0.1:8080/ | grep -qi "YourPDF"

      - name: Remove smoke container
        if: always()
        run: docker rm -f smoke || true

  deploy:
    name: Deploy to Cloud Run
    needs: build-and-push
    # No GCP variables configured yet -> skip instead of failing the push.
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation; no long-lived service-account key
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.GCP_SERVICE_NAME }}
      IMAGE_REPO: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/yourpdf-web
    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        # concurrency 1: the work is CPU-bound and shells out to single-threaded tools.
        # timeout 900: must exceed the app's own SUBPROCESS_TIMEOUT (600 s) or a long OCR is
        #   killed by the platform while the container keeps working.
        # memory 4Gi: LibreOffice + OCR + a 100-page raster, with /tmp counted as RAM.
        # Never set PORT as an env var — Cloud Run reserves it and the deploy fails.
        #
        # Retry loop: Cloud Run's Docker Hub mirror (mirror.gcr.io) lags a fresh push and
        # answers "Image 'mirror.gcr.io/<user>/<repo>:<tag>' not found" for the first 1-3
        # attempts. Retry up to 4 times, ~90 s apart, instead of rebuilding. Each attempt
        # re-resolves the single mutable `latest` tag to its digest inside this job, so the
        # deploy is pinned to immutable bytes without relying on cross-job outputs (which came
        # through empty once). A failed attempt costs nothing: the service already exists and
        # traffic only moves to the new revision on success.
        run: |
          IMAGE_TAG="$IMAGE_REPO:latest"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          deployed=false
          for attempt in 1 2 3 4; do
            DIGEST=$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [ -z "$DIGEST" ]; then
              echo "Attempt $attempt/4: tag $IMAGE_TAG is not resolvable yet; retrying in 15 s..."
              sleep 15
              continue
            fi
            echo "Deploy attempt $attempt/4: $IMAGE_REPO@$DIGEST ($IMAGE_TAG)"
            if gcloud run deploy "$SERVICE" \
              --image "$IMAGE_REPO@$DIGEST" \
              --project "$PROJECT" \
              --region "$REGION" \
              --platform managed \
              --port 8080 \
              --cpu 2 \
              --memory 4Gi \
              --concurrency 1 \
              --timeout 900 \
              --min-instances 0 \
              --max-instances 2 \
              --cpu-boost \
              --execution-environment gen2 \
              --set-env-vars "YOURPDF_TMP=/tmp,HOME=/tmp,TMPDIR=/tmp,MAX_FILE_SIZE_MB=30,MAX_TOTAL_UPLOAD_MB=30,MAX_RENDER_PAGES=100,YOURPDF_OUT=/app/frontend/out,WEB_LOG_LEVEL=info" \
              --labels "commit=${{ github.sha }},managed-by=github-actions" \
              --quiet; then
              deployed=true
              echo "DEPLOY_DIGEST=$DIGEST" >> "$GITHUB_ENV"
              break
            fi
            echo "Attempt $attempt failed (mirror lag is the usual cause)."
            if [ "$attempt" -lt 4 ]; then
              echo "Retrying with a freshly resolved digest in 90 s..."
              sleep 90
            fi
          done
          if [ "$deployed" != "true" ]; then
            echo "All 4 deploy attempts failed." >&2
            exit 1
          fi

      - name: Verify the live service and the sign-in gate
        # The service is IAP-protected, so an unauthenticated request never returns 200: it is
        # answered with a 302 to accounts.google.com. That redirect IS the success condition here.
        # Never grant allUsers roles/run.invoker — it would make the IAP gate cosmetic.
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format 'value(status.url)')
          REV=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format 'value(status.latestReadyRevisionName)')
          ready=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format 'value(status.conditions[0].status)')
          if [ "$ready" != "True" ]; then
            echo "Latest revision $REV is not Ready (status: $ready)" >&2
            exit 1
          fi

          gate=""
          for i in $(seq 1 24); do
            loc=$(curl -sS -o /dev/null -D - -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/141.0 Safari/537.36" \
                    -H "Accept: text/html" "$URL/" 2>/dev/null | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^location:/{print $2; exit}')
            case "$loc" in
              https://accounts.google.com/*) gate="$loc"; break ;;
            esac
            sleep 5
          done
          if [ -z "$gate" ]; then
            echo "$URL did not redirect to accounts.google.com — the IAP gate is not enforcing" >&2
            exit 1
          fi

          {
            echo "### Deployed $SERVICE"
            echo "- URL: $URL"
            echo "- Revision: $REV"
            echo "- Image: $IMAGE_TAG"
            echo "- Digest: $IMAGE_REPO@$DEPLOY_DIGEST"
            echo "- IAP gate: ok (302 → accounts.google.com)"
          } >> "$GITHUB_STEP_SUMMARY"
