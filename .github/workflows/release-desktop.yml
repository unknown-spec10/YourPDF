name: Release Desktop

# Windows-only on purpose: the sidecar is a PyInstaller --onedir Windows build, the bundled
# Ghostscript/Tesseract/Poppler are Windows binaries, and the shell uses taskkill/explorer/
# MessageBoxW. macOS/Linux would be a separate port, not a matrix entry.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build, sign & publish installer
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "desktop/requirements-build.txt"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned to the exact toolchain that generated the lockfiles: npm < 11.6
          # rejects them ("Missing: @emnapi/runtime from lock file") because of how
          # it resolves optional platform deps, which breaks `npm ci` on the runner.
          node-version: "24.11.0"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Pin npm to the lockfile's toolchain
        run: npm i -g npm@11.6.1

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements-build.txt

      - name: Vendor Poppler
        shell: pwsh
        run: |
          $release = Invoke-RestMethod `
            -Uri 'https://api.github.com/repos/oschwartz10612/poppler-windows/releases/latest' `
            -Headers @{ 'User-Agent' = 'yourpdf-ci' }
          $asset = $release.assets | Where-Object { $_.name -match '^Release-.*\.zip$' } |
            Select-Object -First 1
          if (-not $asset) { throw 'No Poppler release zip found' }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile poppler.zip
          Expand-Archive poppler.zip -DestinationPath C:\poppler
          $root = Get-ChildItem C:\poppler -Directory | Select-Object -First 1
          "YOURPDF_POPPLER=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

          # pdf2image shells out to pdfinfo/pdftoppm, so the tests need Poppler on PATH —
          # without it the sign/pdf-to-images tests 500 and the release never publishes.
          $bin = Join-Path $root.FullName 'Library\bin'
          foreach ($exe in @('pdfinfo.exe', 'pdftoppm.exe', 'pdftocairo.exe')) {
            if (-not (Test-Path (Join-Path $bin $exe))) { throw "Poppler is missing $exe under $bin" }
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q tests

      - name: Install native toolchain (Ghostscript, Tesseract)
        shell: pwsh
        run: |
          choco install ghostscript tesseract --yes --no-progress

          $gs = Get-ChildItem 'C:\Program Files\gs' -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $gs) { throw 'Ghostscript install not found under C:\Program Files\gs' }

          $tess = 'C:\Program Files\Tesseract-OCR'
          if (-not (Test-Path "$tess\tesseract.exe")) { throw 'Tesseract install not found' }

          "YOURPDF_GS=$($gs.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "YOURPDF_TESSERACT=$tess" | Out-File -FilePath $env:GITHUB_ENV -Append
          "YOURPDF_PYTHON=$((Get-Command python).Source)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check release tag matches both version files
        shell: pwsh
        run: |
          # tauri.conf.json drives the updater's version comparison; package.json stays the
          # human-facing one. They must agree or an update can be offered forever.
          $pkg = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($pkg -ne $tauri) { throw "version mismatch: package.json=$pkg tauri.conf.json=$tauri" }
          if ("v$pkg" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match version $pkg"
          }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Freeze the sidecar
        working-directory: desktop
        run: npm run build:sidecar

      - name: Vendor native binaries (pruned)
        working-directory: desktop
        run: npm run vendor

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ed25519 (minisign) key used by the updater. NOT Authenticode: SmartScreen
          # still warns on install until a code-signing certificate exists.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "YourPDF Desktop ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          # Generates latest.json (with the .sig for each platform bundle) in the release,
          # which is exactly what plugins.updater.endpoints points at.
          includeUpdaterJson: true
          # No --target: the runner is already x86_64-pc-windows-msvc, and adding it would
          # move output to target/<triple>/release, breaking the smoke/prepare paths below.

      - name: Smoke test the packaged build
        # Non-blocking on purpose: a GUI app on a headless runner is exactly the kind of thing
        # that goes flaky, and a flaky gate must never block a release. Flip to blocking once
        # it has run green on a few tags.
        continue-on-error: true
        shell: pwsh
        working-directory: desktop
        run: |
          $exe = 'src-tauri/target/release/yourpdf-desktop.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe" }

          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9225'
          $app = Start-Process -FilePath $exe -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 2
              try {
                $null = Invoke-WebRequest -Uri 'http://127.0.0.1:9225/json/version' -UseBasicParsing -TimeoutSec 2
                $ready = $true
                break
              } catch { }
            }
            if (-not $ready) { throw 'App did not expose a debug port within 120s' }
            $env:CDP_PORT = '9225'
            node scripts/smoke.mjs
            if ($LASTEXITCODE -ne 0) { throw "Smoke test failed (exit $LASTEXITCODE)" }
          } finally {
            Get-Process -Name 'yourpdf-desktop' -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - name: Prepare stable-name assets
        shell: pwsh
        working-directory: desktop
        run: |
          # docs/install.md promises a version-independent one-liner that fetches
          # .../releases/latest/download/install.ps1 and YourPDF-Desktop-setup.exe, so the
          # versioned Tauri installer must also be published under the stable name.
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $built = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' |
            Select-Object -First 1
          if (-not $built) { throw 'No NSIS installer produced' }

          $stable = 'release-assets'
          New-Item -ItemType Directory -Path $stable -Force | Out-Null
          Copy-Item $built.FullName (Join-Path $stable 'YourPDF-Desktop-setup.exe')
          Copy-Item $built.FullName (Join-Path $stable "YourPDF-Desktop-$version-setup.exe")
          Copy-Item 'installer/install.ps1' $stable
          Copy-Item 'installer/install.cmd' $stable
          Copy-Item 'installer/INSTALL.txt' $stable

          $lines = Get-ChildItem $stable -Filter '*-setup.exe' | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $lines | Set-Content (Join-Path $stable 'SHA256SUMS.txt')
          Get-ChildItem $stable | Select-Object Name, Length

      - name: Publish stable-name assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release-assets/YourPDF-Desktop-setup.exe
            desktop/release-assets/YourPDF-Desktop-*-setup.exe
            desktop/release-assets/SHA256SUMS.txt
            desktop/release-assets/install.ps1
            desktop/release-assets/install.cmd
            desktop/release-assets/INSTALL.txt
          fail_on_unmatched_files: true
