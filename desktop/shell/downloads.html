<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Downloads</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0f;
        --surface: #14141b;
        --border: rgba(255, 255, 255, 0.1);
        --text: #f2f2f7;
        --muted: #9a9aab;
        --accent: #6d6dff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 18px 20px 14px;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }
      h1 { font-size: 15px; margin: 0; letter-spacing: 0.01em; }
      .folder {
        font-size: 12px;
        color: var(--muted);
        word-break: break-all;
        margin-top: 3px;
      }
      .actions { display: flex; gap: 8px; }
      button {
        font: inherit;
        font-weight: 600;
        font-size: 12.5px;
        border-radius: 9px;
        padding: 7px 12px;
        cursor: pointer;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      button:hover { background: rgba(255, 255, 255, 0.06); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.primary:hover { background: #5b5bf0; }
      button.ghost { color: var(--muted); }
      button.danger:hover { border-color: rgba(255, 99, 99, 0.5); color: #ff9b9b; }
      main { flex: 1; overflow-y: auto; padding: 14px 16px 22px; }
      ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      li {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .meta { min-width: 0; flex: 1; }
      .name { font-weight: 600; word-break: break-all; }
      .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
      .missing { color: #ff9b9b; }
      .row-actions { display: flex; gap: 6px; flex-shrink: 0; }
      .empty { color: var(--muted); text-align: center; padding: 48px 16px; }
      .empty strong { display: block; color: var(--text); margin-bottom: 6px; font-size: 14px; }
      footer {
        border-top: 1px solid var(--border);
        padding: 10px 16px;
        font-size: 11.5px;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Downloads</h1>
        <div class="folder" id="folder">…</div>
      </div>
      <div class="actions">
        <button id="change">Change folder…</button>
        <button id="clear" class="ghost danger">Clear list</button>
      </div>
    </header>

    <main>
      <ul id="list"></ul>
      <div class="empty" id="empty" hidden>
        <strong>Nothing downloaded yet</strong>
        Run any tool and press Download — the file lands here, and in the folder above.
      </div>
    </main>

    <footer>
      <span>Files are processed on this machine only. Nothing is uploaded.</span>
      <span id="count"></span>
    </footer>

    <script>
      const api = window.yourpdf;
      const listEl = document.getElementById("list");
      const emptyEl = document.getElementById("empty");
      const folderEl = document.getElementById("folder");
      const countEl = document.getElementById("count");

      const humanSize = (bytes) => {
        if (bytes == null) return "";
        const units = ["B", "KB", "MB", "GB"];
        let value = bytes;
        let unit = 0;
        while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit += 1; }
        return `${value >= 10 || unit === 0 ? Math.round(value) : value.toFixed(1)} ${units[unit]}`;
      };

      const relTime = (iso) => {
        const then = new Date(iso).getTime();
        if (Number.isNaN(then)) return "";
        const mins = Math.round((Date.now() - then) / 60000);
        if (mins < 1) return "just now";
        if (mins < 60) return `${mins} min ago`;
        const hours = Math.round(mins / 60);
        if (hours < 24) return `${hours} h ago`;
        return new Date(iso).toLocaleDateString();
      };

      const button = (label, cls, onClick) => {
        const b = document.createElement("button");
        b.textContent = label;
        if (cls) b.className = cls;
        b.addEventListener("click", onClick);
        return b;
      };

      let current = [];

      function render() {
        listEl.textContent = "";
        emptyEl.hidden = current.length > 0;
        countEl.textContent = current.length ? `${current.length} file${current.length === 1 ? "" : "s"}` : "";

        for (const item of current) {
          const li = document.createElement("li");
          const meta = document.createElement("div");
          meta.className = "meta";

          const name = document.createElement("div");
          name.className = "name";
          name.textContent = item.name;

          const sub = document.createElement("div");
          sub.className = "sub";
          const bits = [humanSize(item.size), relTime(item.at)];
          if (!item.exists) {
            const gone = document.createElement("span");
            gone.className = "missing";
            gone.textContent = "file moved or deleted";
            sub.append(bits.filter(Boolean).join(" · ") + " · ", gone);
          } else {
            sub.textContent = bits.filter(Boolean).join(" · ");
          }

          meta.append(name, sub);

          const row = document.createElement("div");
          row.className = "row-actions";
          row.append(
            button("Open", item.exists ? "primary" : "", async () => {
              const res = await api.open(item.path);
              if (res && res.ok === false && res.error) alert(res.error);
            }),
            button("Show in folder", "", () => api.reveal(item.path)),
            button("Remove", "ghost", async () => { await api.remove(item.path); await refresh(); })
          );

          li.append(meta, row);
          listEl.append(li);
        }
      }

      async function refresh() {
        current = (await api.listDownloads()) || [];
        render();
        folderEl.textContent = await api.folder();
      }

      document.getElementById("change").addEventListener("click", async () => {
        const res = await api.chooseFolder();
        if (res && res.ok) {
          folderEl.textContent = res.dir;
          await refresh();
        }
      });

      document.getElementById("clear").addEventListener("click", async () => {
        if (current.length && confirm("Clear the list? Files stay on disk.")) {
          await api.clear();
          await refresh();
        }
      });

      refresh();
      // The window stays open while you work: keep it in sync with new saves.
      setInterval(refresh, 2000);
    </script>
  </body>
</html>
