[package]
name = "yourpdf-desktop"
version = "0.1.3"
description = "YourPDF Desktop — local PDF toolkit. Files never leave this machine."
authors = ["Deep Podder"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "yourpdf_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rand = "0.8"
