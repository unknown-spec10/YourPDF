services:
  backend:
    image: ${DOCKERHUB_USERNAME:-deepdocker2023}/yourpdf-backend:latest
    container_name: yourpdf-prod-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    volumes:
      - tmp_data:/app/tmp
      - static_data:/app/static
    environment:
      - API_KEY=${API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: ${DOCKERHUB_USERNAME:-deepdocker2023}/yourpdf-frontend:latest
    container_name: yourpdf-prod-frontend
    restart: always

  nginx:
    image: ${DOCKERHUB_USERNAME:-deepdocker2023}/yourpdf-nginx:latest
    container_name: yourpdf-prod-nginx
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: always

volumes:
  tmp_data:
  static_data:
