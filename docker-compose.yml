version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: yourpdf-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dev-redis-password}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-redis-password}
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yourpdf-celery-worker
    command: celery -A app.celery_app.celery worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dev-redis-password}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery inspect ping | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
